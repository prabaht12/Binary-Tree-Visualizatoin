<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Binary Tree Visualizer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Binary Tree Visualizer</h1>
      <div class="controls">
        <input type="number" id="nodeValue" placeholder="Enter node value" />
        <button onclick="insertNode()">Insert Node</button>
        <button onclick="deleteNode()">Delete Node</button>
        <button onclick="traverseTree('inorder')">Inorder</button>
        <button onclick="traverseTree('preorder')">Preorder</button>
        <button onclick="traverseTree('postorder')">Postorder</button>
      </div>
      <svg id="treeContainer"></svg>
    </div>
    <script src="script.js"></script>
  </body>
</html>
